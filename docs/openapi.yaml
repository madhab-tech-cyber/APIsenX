
openapi: 3.1.0

info:
  title: APIsenX Mock API
  version: 1.0.0
  description: >
    API contract for the authorized APIsenX security lab.
    Authorization is enforced by the API using the authenticated
    principal, role, resource ownership, sharing grants, and policy.

servers:
  - url: http://localhost:8000
    description: Local authorized lab (update to match the implementation)

tags:
  - name: Orders
  - name: Administration

security:
  - bearerAuth: []

paths:
  /orders:
    get:
      tags:
        - Orders
      summary: List orders accessible to the authenticated principal
      operationId: listOrders
      description: >
        Customers receive only their own authorized orders.
        Administrators may read all orders when their policy permits.
        The server must derive identity from the validated token,
        not from a client-supplied owner ID.
      responses:
        '200':
          description: Authorized order list
          content:
            application/json:
              schema:
                type: object
                required:
                  - orders
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'

    get:
      tags:
        - Orders
      summary: Read an order
      operationId: getOrder
      description: >
        Allow the owner to read their order. An administrator may read
        any order when authorized. Deny cross-owner access unless an
        applicable explicit sharing grant permits it. Do not treat a
        different object ID alone as proof of an attack.
      responses:
        '200':
          description: Authorized order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Orders
      summary: Update an order
      operationId: updateOrder
      description: >
        Requires the orders:manage:any permission.
        Ordinary customers must be denied. The server must authorize
        the authenticated principal before updating the order and
        must record an audit event. Clients cannot change the order
        owner, identifier, total, or currency through this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
            example:
              status: shipped
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid update request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/orders:
    get:
      tags:
        - Administration
      summary: List all orders for authorized administrators
      operationId: listAdminOrders
      description: >
        Requires the orders:read:any permission. Ordinary customers
        must be denied and the denial should produce an appropriate
        security audit event.
      responses:
        '200':
          description: All orders visible to the administrator
          content:
            application/json:
              schema:
                type: object
                required:
                  - orders
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: Unique order identifier
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9-]+$'
      example: order-1001

  schemas:
    User:
      type: object
      required:
        - id
        - name
        - role
        - active
      properties:
        id:
          type: string
          example: user-a
        name:
          type: string
          example: Alice Example
        role:
          type: string
          enum:
            - customer
            - admin
        active:
          type: boolean
          description: Inactive users must not be authorized.

    Order:
      type: object
      required:
        - id
        - owner_id
        - status
        - total
        - currency
      properties:
        id:
          type: string
          example: order-1001
        owner_id:
          type: string
          description: Resource owner identifier
          example: user-a
        status:
          type: string
          enum:
            - processing
            - shipped
            - delivered
          example: processing
        total:
          type: number
          minimum: 0
          example: 1200
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: INR

    OrderUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - processing
            - shipped
            - delivered
          description: New status for the order
          example: shipped

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - INVALID_REQUEST
            message:
              type: string

  responses:
    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Authenticated principal lacks permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Requested resource does not exist or is not disclosed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
