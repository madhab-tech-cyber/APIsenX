
openapi: 3.1.0

info:
  title: APIsenX Mock API
  version: 1.0.0
  description: APIsenX mock API contract for the authorized lab.

servers:
  - url: http://localhost:8000
    description: Local authorized lab

tags:
  - name: Orders
  - name: Administration

security:
  - bearerAuth: []

paths:
  /support/orders:
    get:
      tags:
        - Orders
      summary: List assigned support orders with masked fields only
      operationId: listSupportOrders
      parameters:
        - $ref: '#/components/parameters/PolicyVersion'
      responses:
        '200':
          description: Assigned, masked support orders
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportOrder'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /orders:
    get:
      tags:
        - Orders
      summary: List orders accessible to the authenticated principal
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/PolicyVersion'
      description: >
        Customers require orders:read:own and may read same-tenant active
        read shares. Tenant admins require orders:read:tenant and are scoped
        to their server-resolved tenant. Lab administrators require
        orders:read:any. Requests must send X-Policy-Version: AP-1.0.
        Unknown or missing policy versions are rejected. Tenant identifiers
        are internal authorization context and are omitted from responses.
        Sharing grants are server-resolved, same-tenant, read-only and
        rejected when revoked, expired or version-mismatched.
      responses:
        '200':
          description: Authorized order list
          content:
            application/json:
              schema:
                type: object
                required:
                  - orders
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags:
        - Orders
      summary: Read an order
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/PolicyVersion'
      description: >
        Customers require orders:read:own and may read an owned order.
        Lab administrators require orders:read:any. The current
        implementation checks actor and resource tenant identifiers
        where present, but it does not implement the complete AP-1.0
        tenant-context model or policy-version negotiation. Missing,
        blank, invalid, or mismatched tenant context is denied by the
        current fixture-based checks where applicable. This does not
        represent the complete AP-1.0 tenant-context model. Cross-owner
        sharing remains unsupported until its authoritative grant,
        tenant-context, and revocation policies are implemented and
        independently reviewed. A different object ID alone is not proof
        of an attack. Tenant identifiers are not exposed in the public
        order response.
      responses:
        '200':
          description: Authorized order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Orders
      summary: Update an order
      operationId: updateOrder
      parameters:
        - $ref: '#/components/parameters/PolicyVersion'
      description: >
        Requires the server-side orders:manage:any function permission
        and applicable object-level authorization. The function
        permission is checked independently of ownership before
        mutation. The current implementation checks actor and resource
        tenant identifiers where present, but it does not implement
        the complete AP-1.0 tenant-context model or policy-version
        negotiation. Missing, blank, invalid, or mismatched tenant
        context is denied by the current fixture-based checks where
        applicable, without changing order state. Ordinary customers
        are denied this management operation. The server records a
        privacy-conscious audit event. Clients cannot change the order
        owner, identifier, total, or currency. Updates are process-local
        and reset when the API process restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
            example:
              status: shipped
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/orders:
    get:
      tags:
        - Administration
      summary: List orders for authorized lab administrators
      operationId: listAdminOrders
      parameters:
        - $ref: '#/components/parameters/PolicyVersion'
      description: >
        Requires the server-side orders:read:any function permission.
        The permission check occurs before inventory iteration,
        including when the inventory is empty. Object ownership cannot
        grant this function permission. The mock fixtures use one shared
        lab tenant. The current implementation checks tenant identifiers
        where present and denies invalid or inconsistent tenant context
        in the applicable fixture-based checks. Missing, blank, invalid,
        or mismatched tenant context is denied where the current fixture-
        based checks apply. This does not establish scoped tenant
        administration or cross-tenant operations. This lab-wide
        administrative behavior must not be used to authorize
        cross-tenant operations. The complete AP-1.0 tenant-context
        model and policy-version negotiation are not implemented.
        Denials produce a security audit event.
      responses:
        '200':
          description: Orders visible to the authorized lab administrator
          content:
            application/json:
              schema:
                type: object
                required:
                  - orders
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    PolicyVersion:
      name: X-Policy-Version
      in: header
      required: true
      description: Authorization policy contract version; only AP-1.0 is accepted.
      schema:
        type: string
        enum: [AP-1.0]
      example: AP-1.0
    OrderId:
      name: orderId
      in: path
      required: true
      description: Unique order identifier
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9-]+$'
      example: order-1001

  schemas:
    User:
      type: object
      required:
        - id
        - name
        - role
        - active
      properties:
        id:
          type: string
          example: user-a
        name:
          type: string
          example: Alice Example
        role:
          type: string
          enum:
            - customer
            - admin
        active:
          type: boolean
          description: Inactive users must not be authorized.

    Order:
      type: object
      description: >
        Public order representation. Tenant identifiers are internal
        authorization context and are intentionally omitted from responses.
      required:
        - id
        - owner_id
        - status
        - total
        - currency
      properties:
        id:
          type: string
          example: order-1001
        owner_id:
          type: string
          description: Resource owner identifier
          example: user-a
        status:
          type: string
          enum:
            - processing
            - shipped
            - delivered
          example: processing
        total:
          type: number
          minimum: 0
          example: 1200
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: INR

    SupportOrder:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [processing, shipped, delivered]
      additionalProperties: false

    OrderUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - processing
            - shipped
            - delivered
          description: New status for the order
          example: shipped

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - INVALID_REQUEST
            message:
              type: string

  responses:
    InvalidRequest:
      description: Invalid request or path parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Authenticated principal lacks permission or tenant access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Requested resource does not exist or is not disclosed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
