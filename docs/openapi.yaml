
openapi: 3.1.0

info:
  title: APIsenX Mock API
  version: 1.0.0
  description: >
    API contract for the authorized APIsenX security lab.
    Authorization is enforced using authenticated identity, server-side
    role permissions, tenant context, resource ownership, and policy.
    Sharing grants remain unsupported until their policy and implementation
    are approved and validated. This contract describes the mock lab only;
    it does not claim production readiness or integrated AP-1.0 completion.

servers:
  - url: http://localhost:8000
    description: Local authorized lab

tags:
  - name: Orders
  - name: Administration

security:
  - bearerAuth: []

paths:
  /orders:
    get:
      tags:
        - Orders
      summary: List orders accessible to the authenticated principal
      operationId: listOrders
      description: >
        Customers require the server-side orders:read:own permission.
        Lab administrators require orders:read:any. Identity and permissions
        are derived from server-side policy, never client-supplied owner or
        role fields. Every returned order must pass tenant-context validation
        before ownership-based visibility is evaluated. Missing, blank,
        invalid, or mismatched tenant context is denied. The tenant identifier
        is internal authorization context and is not exposed in the public
        order response. This mock lab uses one shared lab tenant and does not
        establish cross-tenant administration.
      responses:
        '200':
          description: Authorized order list
          content:
            application/json:
              schema:
                type: object
                required:
                  - orders
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'

    get:
      tags:
        - Orders
      summary: Read an order
      operationId: getOrder
      description: >
        Customers require orders:read:own and may read an owned order.
        Lab administrators require orders:read:any. Tenant context is
        validated before role permissions and ownership are evaluated.
        Missing, blank, invalid, or mismatched tenant context is denied.
        Cross-owner sharing remains unsupported and denied until its AP-1.0
        grant, tenant context, and revocation policy are implemented and
        independently reviewed. A different object ID alone is not proof
        of an attack. Tenant identifiers are not exposed in the public
        order response.
      responses:
        '200':
          description: Authorized order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Orders
      summary: Update an order
      operationId: updateOrder
      description: >
        Requires the server-side orders:manage:any function permission
        and applicable object-level authorization. The API checks the
        function permission independently of ownership before mutation.
        Tenant context is validated before the order is changed. Missing,
        blank, invalid, or mismatched tenant context is denied without
        changing order state. Ordinary customers are denied. The server
        records a privacy-conscious audit event. Clients cannot change
        the order owner, identifier, total, or currency. Updates are
        process-local and reset when the API process restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
            example:
              status: shipped
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/orders:
    get:
      tags:
        - Administration
      summary: List orders for authorized lab administrators
      operationId: listAdminOrders
      description: >
        Requires the server-side orders:read:any function permission.
        The permission check occurs before inventory iteration, including
        when the inventory is empty. Object ownership cannot grant this
        function permission. The mock fixtures use one shared lab tenant.
        Tenant context must be valid and consistent; mixed-tenant inventory
        is denied. This lab-wide administrative behavior does not establish
        scoped tenant-administrator or support access and must not be used
        to authorize cross-tenant operations. Denials produce a security
        audit event.
      responses:
        '200':
          description: Orders visible to the authorized lab administrator
          content:
            application/json:
              schema:
                type: object
                required:
                  - orders
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: Unique order identifier
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9-]+$'
      example: order-1001

  schemas:
    User:
      type: object
      required:
        - id
        - name
        - role
        - active
      properties:
        id:
          type: string
          example: user-a
        name:
          type: string
          example: Alice Example
        role:
          type: string
          enum:
            - customer
            - admin
        active:
          type: boolean
          description: Inactive users must not be authorized.

    Order:
      type: object
      description: >
        Public order representation. Tenant identifiers are internal
        authorization context and are intentionally omitted from responses.
      required:
        - id
        - owner_id
        - status
        - total
        - currency
      properties:
        id:
          type: string
          example: order-1001
        owner_id:
          type: string
          description: Resource owner identifier
          example: user-a
        status:
          type: string
          enum:
            - processing
            - shipped
            - delivered
          example: processing
        total:
          type: number
          minimum: 0
          example: 1200
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: INR

    OrderUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - processing
            - shipped
            - delivered
          description: New status for the order
          example: shipped

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - INVALID_REQUEST
            message:
              type: string

  responses:
    InvalidRequest:
      description: Invalid request or path parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Authenticated principal lacks permission or tenant access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Requested resource does not exist or is not disclosed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
