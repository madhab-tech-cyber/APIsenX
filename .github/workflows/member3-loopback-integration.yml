name: Member 3 Loopback Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-python-loopback:
    name: Rust/Python Loopback Contract
    # Pin the runner to avoid an unplanned ubuntu-latest image migration.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned Python project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check locked Rust library
        run: |
          rustup component add rustfmt clippy
          cargo test --locked --all-targets --manifest-path collector/Cargo.toml
          cargo fmt --check --manifest-path collector/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path collector/Cargo.toml -- -D warnings
      - name: Check real loopback Rust/Python batch handoff
        run: python scripts/check_member3_loopback.py
      - name: Package locked Rust collector source with checksums
        run: |
          cargo package --locked --manifest-path collector/Cargo.toml
          sha256sum collector/target/package/api-sentinel-collector-0.1.0.crate collector/Cargo.lock > collector/target/package/SHA256SUMS
          sha256sum --check collector/target/package/SHA256SUMS
          rustc --version > collector/target/package/toolchain.txt
          cargo --version >> collector/target/package/toolchain.txt
      - name: Retain collector source package and build inputs
        uses: actions/upload-artifact@v4
        with:
          name: member3-collector-source-${{ github.sha }}
          path: |
            collector/target/package/api-sentinel-collector-0.1.0.crate
            collector/target/package/SHA256SUMS
            collector/target/package/toolchain.txt
            collector/Cargo.lock
          if-no-files-found: error
          retention-days: 30
