name: API-Sentinel CI

on:
  push:
    branches:
      - member6/dashboard-devsecops
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject UTF-8 BOM in tracked text sources
        run: python scripts/check_no_bom.py

      - name: Check for accidentally committed sensitive files
        shell: bash
        run: |
          set -e
          forbidden_files=(
            ".env"
            ".env.local"
            ".env.production"
            "*.pem"
            "*.key"
            "*.p12"
            "*.pfx"
          )

          for pattern in "${forbidden_files[@]}"; do
            if find . -type f -not -path './.git/*' -not -path './dashboard/node_modules/*' -name "$pattern" | grep -q .; then
              echo "Forbidden sensitive file detected: $pattern"
              exit 1
            fi
          done

      - name: Repository structure check
        shell: bash
        run: |
          set -e
          test -d dashboard
          test -d tests
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          echo "Repository foundation checks passed."

  python-tests:
    name: Repository regression and security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run repository regression and security tests
        run: python -m unittest discover -s tests -v

  dashboard-check:
    name: Dashboard quality and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Lint dashboard
        run: npm run lint

      - name: Run dashboard tests
        run: npm test

      - name: Build dashboard
        run: npm run build

      - name: Audit dashboard dependencies
        run: npm audit --audit-level=high

      - name: Generate dashboard CycloneDX SBOM
        run: npm sbom --package-lock-only --sbom-format=cyclonedx > "$RUNNER_TEMP/dashboard-sbom.cdx.json"

      - name: Validate dashboard SBOM
        run: >-
          node -e "const fs=require('node:fs');
          const bom=JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
          if (bom.bomFormat !== 'CycloneDX' || typeof bom.specVersion !== 'string' ||
          !bom.specVersion.startsWith('1.') ||
          !Array.isArray(bom.components) || bom.components.length === 0) {
          console.error('Invalid CycloneDX SBOM'); process.exit(1); }"
          "$RUNNER_TEMP/dashboard-sbom.cdx.json"

      - name: Upload dashboard SBOM as review artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-sbom
          path: ${{ runner.temp }}/dashboard-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
