name: Mock API Security Tests

on:
  push:
    branches:
      - member5/mock-api
  pull_request:
    branches:
      - main
      - member5/mock-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: API Security and Quality Gates
    # Pin the runner to avoid an unplanned ubuntu-latest image migration.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install security and quality tools
        run: python -m pip install ruff==0.17.1 pip-audit==2.10.1

      - name: Run authorization, API, and OpenAPI tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff lint checks
        run: python -m ruff check mock-api tests

      - name: Audit dependency vulnerabilities
        run: python -m pip_audit -r requirements.txt
