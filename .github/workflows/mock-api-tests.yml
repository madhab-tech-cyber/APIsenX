name: Mock API Security Tests

on:
  push:
    branches:
      - member5/mock-api
  pull_request:
    branches:
      - member5/mock-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run API and Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run authorization, API, and OpenAPI tests
        run: python -m unittest discover -s tests -v
