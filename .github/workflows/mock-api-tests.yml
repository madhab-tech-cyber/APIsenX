name: Mock API Security Tests

on:
  push:
    branches:
      - main
      - member5/mock-api
  pull_request:
    branches:
      - main
      - member5/mock-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: API Security and Quality Gates
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install security and quality tools
        run: python -m pip install ruff==0.17.1 pip-audit==2.10.1

      - name: Run authorization, API, and OpenAPI tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff lint checks
        run: python -m ruff check mock-api tests

      - name: Audit dependency vulnerabilities
        run: python -m pip_audit -r requirements.txt

      - name: Run bounded Day 19 local-lab load stages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/day19-ci
          printf '{"commit":"%s","runner":"GitHub Actions ubuntu-24.04","target":"127.0.0.1:8000","policy_version":"AP-1.0","note":"CI-isolated local Mock API measurements; not production or human sign-off"}\n' "$GITHUB_SHA" > evidence/day19-ci/metadata.json
          python -m uvicorn main:app --app-dir mock-api --host 127.0.0.1 --port 8000 > /tmp/day19-mock-api.log 2>&1 &
          echo $! > /tmp/day19-mock-api.pid
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail -H 'Authorization: Bearer lab-user-a-token' -H 'X-Policy-Version: AP-1.0' http://127.0.0.1:8000/orders >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/day19-mock-api.log
            exit 1
          fi
          python scripts/day19_load_probe.py --url http://127.0.0.1:8000/orders --requests 100 --concurrency 5 --token lab-user-a-token --policy-version AP-1.0 | tee evidence/day19-ci/normal.json
          python scripts/day19_load_probe.py --url http://127.0.0.1:8000/orders --requests 500 --concurrency 25 --token lab-user-a-token --policy-version AP-1.0 | tee evidence/day19-ci/overload.json
          sleep 3
          python scripts/day19_load_probe.py --url http://127.0.0.1:8000/orders --requests 100 --concurrency 5 --token lab-user-a-token --policy-version AP-1.0 | tee evidence/day19-ci/recovery.json
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8000"
          policy = {"X-Policy-Version": "AP-1.0"}

          def get_admin_orders():
              request = urllib.request.Request(
                  base + "/admin/orders",
                  headers={"Authorization": "Bearer lab-admin-token", **policy},
              )
              with urllib.request.urlopen(request, timeout=5) as response:
                  return json.loads(response.read())

          before = get_admin_orders()
          request = urllib.request.Request(
              base + "/orders/order-1002",
              data=json.dumps({"status": "processing"}).encode(),
              headers={
                  "Authorization": "Bearer lab-user-a-token",
                  "X-Policy-Version": "AP-1.0",
                  "X-Request-Nonce": "day19-ci-bola-check-0001",
                  "Content-Type": "application/json",
              },
              method="PATCH",
          )
          try:
              with urllib.request.urlopen(request, timeout=5) as response:
                  denied_status = response.status
          except urllib.error.HTTPError as exc:
              denied_status = exc.code
          after = get_admin_orders()
          report = {
              "unauthorized_cross_owner_patch_status": denied_status,
              "expected_denied_statuses": [403, 404],
              "order_state_unchanged": before == after,
          }
          with open("evidence/day19-ci/order-nonmutation.json", "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          if denied_status not in (403, 404) or before != after:
              raise SystemExit("Day 19 rejected-request non-mutation check failed")
          PY
          kill "$(cat /tmp/day19-mock-api.pid)" || true

      - name: Upload Day 19 CI measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day19-load-probe-${{ github.run_id }}
          path: evidence/day19-ci/
          if-no-files-found: warn
          retention-days: 30
