name: Analytics Security Tests

on:
  push:
    branches: [member4/detection]
  pull_request:
    branches: [main, member4/detection, member3/rust-enforcement, member6/dashboard-devsecops]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics:
    name: Analytics Security and Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned project and check dependencies
        run: >-
          python -m pip install -r requirements.txt
          ruff==0.17.1 bandit==1.8.6 pip-audit==2.10.1 detect-secrets==1.5.0
      - name: Run existing API, contract and new analytics regressions
        run: python -m unittest discover -s tests -v
      - name: Reproduce self-labelled detection corpus and automated review demo
        run: |
          python -m analytics.evaluate
          python -m analytics.review_demo
      - name: Lint analytics, tests and secret-check helper
        run: >-
          python -m ruff check analytics tests scripts/check_analytics_secrets.py
      - name: Python static security checks
        run: python -m bandit -r analytics -q
      - name: Scan Member 4 source and evidence for secrets
        run: python scripts/check_analytics_secrets.py
      - name: Audit project dependencies
        run: python -m pip_audit -r requirements.txt
